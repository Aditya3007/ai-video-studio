# Real Provider E2E Profile
# This profile selects real external providers for smoke testing.
# Ensure required API keys are set in environment variables before use.

llm:
  provider: groq
  model: llama-3.3-70b-versatile
  temperature: 0.7
  max_tokens: 4096

image:
  provider: google
  model: gemini-3.1-flash-image
  aspect_ratio: "9:16"

tts:
  provider: sarvam
  model: bulbul:v3
  language: "hi-IN"
  voice: shubh

video:
  provider: json2video
  mode: composition

pipeline:
  aspect_ratio: "9:16"
  target_duration_seconds: 30
